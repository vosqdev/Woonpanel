<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Woonpanel.com</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#171717" />
    <meta name="description" content="Woonpanel.com — Jouw mening over wonen telt. Het onafhankelijke bewonerspanel voor inwoners van Dronten, Biddinghuizen en Swifterbant." />
    <meta property="og:title" content="Woonpanel.com" />
    <meta property="og:description" content="Woonpanel.com — Jouw mening over wonen telt. Het onafhankelijke bewonerspanel voor inwoners van Dronten, Biddinghuizen en Swifterbant." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Netlify Forms definitie voor automatische registratie en e-mailnotificaties naar info@woondata.com -->
    <form name="aanmelding-panellid" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="aanmelding-panellid" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="voornaam" />
      <input type="text" name="achternaam" />
      <input type="email" name="email" />
      <input type="text" name="volledige_naam" />
      <input type="text" name="nieuwsbrief" />
      <input type="text" name="datum_aanmelding" />
      <input type="text" name="bron" value="woonpanel.com" />
      <input type="text" name="gemeente" value="Dronten" />
      <input type="email" name="ontvanger" value="info@woondata.com" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
