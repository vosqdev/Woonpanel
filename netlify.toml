[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Direct API endpoint routing to Netlify Functions
[[redirects]]
  from = "/api/submit-survey"
  to = "/.netlify/functions/submit-survey"
  status = 200

[[redirects]]
  from = "/api/register-member"
  to = "/.netlify/functions/register-panel-member"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page App routing for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
